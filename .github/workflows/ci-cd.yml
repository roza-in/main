name: Main Website CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Verify Build Compile
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ github.ref == 'refs/heads/main' && 'https://api.rozx.in' || 'https://staging.api.rozx.in' }}
          NEXT_PUBLIC_APP_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

  deploy-check:
    name: Vercel Deployment Check
    needs: lint-test-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    steps:
      - name: Log Deployment Target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "=================================================="
            echo "  MAIN MARKETING WEBSITE - PRODUCTION DEPLOYMENT"
            echo "  Target Domain: https://rozx.in"
            echo "  Platform: Vercel Production"
            echo "=================================================="
          else
            echo "=================================================="
            echo "  MAIN MARKETING WEBSITE - STAGING DEPLOYMENT"
            echo "  Target Domain: https://staging.rozx.in"
            echo "  Platform: Vercel Preview / Staging"
            echo "=================================================="
          fi

